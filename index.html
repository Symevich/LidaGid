<!doctype html>
<html lang="be">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Інтэрактыўны аўдыёгід па Лідзе: славутасці, прадпрыемствы і вядомыя людзі." />
    <meta name="theme-color" content="#1a2233" />
    <title>Аўдыёгід па горадзе Ліда</title>

    <!-- PWA: installable app + offline mode -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ЛідаГід" />

    <!-- Fix #6: set correct lang before first render -->
    <script>
      try { document.documentElement.lang = localStorage.getItem('lidagid_lang') || 'be'; } catch(e) {}
    </script>

    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>

    <!-- Fix #15: noscript fallback -->
    <noscript>
      <div class="noscript-msg">
        Для работы аўдыёгіда неабходна ўключыць JavaScript.<br />
        Для работы аудиогида необходимо включить JavaScript.<br />
        JavaScript is required to use this audio guide.
      </div>
    </noscript>

    <main id="app" aria-live="polite" aria-atomic="false"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./js/vendor/qrcode.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/app.js"></script>

    <!-- PWA: offline shell + instant repeat loads.
         Only same-origin assets are handled by the service worker;
         Leaflet tiles need a network connection (known limitation). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
